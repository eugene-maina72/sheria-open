services:
  app:
    build: .
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped
    networks:
      - internal

volumes:
  ollama_data:

networks:
  internal:
    driver: bridge
