name: Bug report
description: Report a software or user-interface defect
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include private legal documents, credentials or sensitive personal details.
        Security vulnerabilities must be reported privately under SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the defect and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Start...\n2. Submit...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, browser and deployment method.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I removed personal and confidential legal information.
          required: true
        - label: This is not a security vulnerability.
          required: true
